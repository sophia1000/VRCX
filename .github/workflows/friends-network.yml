name: Friends network

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dotnet/FriendsNetwork/**'
      - 'Dotnet/AppApi/Common/FriendsNetworkApi.cs'
      - 'Dotnet/SQLite.cs'
      - 'src/views/Charts/**'
      - 'src/components/ui/virtual-combobox/**'
      - 'src/localization/en.json'
      - 'src/plugins/router.js'
      - 'src/types/globals.d.ts'
      - 'package*.json'
      - 'vitest.*'
      - 'tests/FriendsNetwork/**'
      - '.github/workflows/friends-network.yml'

permissions:
  contents: read

jobs:
  native-history-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        sqlite: ['2.0.4', '1.0.119']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/FriendsNetwork/FriendsNetwork.Tests.csproj -p:NetworkSqliteVersion=${{ matrix.sqlite }}

  chart-tests:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm test -- src/views/Charts
      - run: npm run typecheck:vue
